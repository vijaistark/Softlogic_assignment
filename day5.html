<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>1. Job Application Form</h1>
    <form>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">
        <br>
        <br>
        <label for="job_email">Email:</label>
        <input type="email" id="job_email" name="email">
        <br>
        <br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br>
        <br>
        <label for="jobdob">Date of Birth:</label>
        <input type="date" id="jobdob" name="dob">
        <br>
        <br>
        
        <label>Gender:</label>
        <input type="radio" id="jobmale" name="jobgender" value="male">
        <label for="jobmale">Male</label>
        <input type="radio" id="jobfemale" name="jobgender" value="female">
        <label for="jobfemale">Female</label>
        <input type="radio" id="jobother" name="jobgender" value="other">
        <label for="jobother">Other</label>
        <br>
        <br>
        <label for="qualification">Qualification:</label>
        <select id="qualification" name="qualification">
            <option value="">Select Qualification</option>
            <option value="10th">10th</option>
            <option value="12th">12th</option>
            <option value="diploma">Diploma</option>
            <option value="ug">UG</option>
            <option value="pg">PG</option>
        </select>

        <br>
        <br>

        <label>Skills:</label>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>
        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" id="python" name="skills" value="python">
        <label for="python">Python</label>

        <br>
        <br>

        <label for="experience">Years of Experience:</label>
        <input type="number" id="experience" name="experience" min="0">

        <br>
        <br>

        <label for="resume">Resume:</label>
        <input type="file" id="resume" name="resume">

        <br>
        <br>

        <label for="jobaddress">Address:</label>
        <br>
        <textarea id="jobaddress" name="address" rows="5" cols="40"></textarea>

        <br>
        <br>

        <label for="location">Preferred Job Location:</label>

        <select id="location" name="location">
            <option value="">Select Location</option>
            <option value="chennai">Chennai</option>
            <option value="bangalore">Bangalore</option>
            <option value="coimbatore">Coimbatore</option>
        </select>

        <br>
        <br>

        <label for="jobpassword">Password:</label>
        <input type="password" id="jobpassword" name="password">

        <br><br>

        <input type="checkbox" id="jobterms" name="terms">
        <label for="jobterms">Terms and Conditions</label>

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    <hr>

    <h1>2. Online Course Registration Form</h1>

    <form>
        <label for="studentname">Student Name:</label>
        <input type="text" id="studentname" name="studentname">

        <br>
        <br>

        <label for="courseemail">Email:</label>
        <input type="email" id="courseemail" name="email">

        <br>
        <br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile">

        <br>
        <br>

        <label for="coursedob">Date of Birth:</label>
        <input type="date" id="coursedob" name="dob">

        <br>
        <br>

        <label>Gender:</label>

        <input type="radio" id="coursemale" name="coursegender" value="male">
        <label for="coursemale">Male</label>
        <input type="radio" id="coursefemale" name="coursegender" value="female">
        <label for="coursefemale">Female</label>
        <input type="radio" id="courseother" name="coursegender" value="other">
        <label for="courseother">Other</label>

        <br>
        <br>

        <label for="course">Select Course:</label>

        <select id="course" name="course">
            <option value="">Select Course</option>
            <option value="HMTL">HMTL</option>
            <option value="CSS">CSS</option>
            <option value="JS">JavaScript</option>
        </select>

        <br>
        <br>

        <label>Learning Mode:</label>

        <input type="radio" id="online" name="learningmode" value="online">
        <label for="online">Online</label>

        <input type="radio" id="offline" name="learningmode" value="offline">
        <label for="offline">Offline</label>

        <br><br>

        <label>Skills Known:</label>

        <input type="checkbox" id="coursehtml" name="knownskills" value="html">
        <label for="coursehtml">HTML</label>

        <input type="checkbox" id="coursecss" name="knownskills" value="css">
        <label for="coursecss">CSS</label>

        <input type="checkbox" id="coursejava" name="knownskills" value="javaScript">
        <label for="coursejava">Java Script</label>

        <br><br>

        <label for="startdate">Course Start Date:</label>
        <input type="date" id="startdate" name="startdate">

        <br><br>

        <label for="photo">Upload Photo:</label>
        <input type="file" id="photo" name="photo">

        <br><br>

        <label for="courseaddress">Address:</label>
        <br>
        <textarea id="courseaddress" name="address" rows="5" cols="40"></textarea>

        <br><br>

        <label for="country">Country:</label>

        <select id="country" name="country">
            <option value="">Select Country</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
        </select>

        <br><br>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username">

        <br><br>

        <label for="coursepassword">Password:</label>
        <input type="password" id="coursepassword" name="password">

        <br><br>

        <label for="confirmpassword">Confirm Password:</label>
        <input type="password" id="confirmpassword" name="confirm_password">

        <br><br>

        <input type="radio" id="courseterms" name="terms">
        <label for="courseterms">I Agree to Terms and Conditions</label>

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
