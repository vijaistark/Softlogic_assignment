<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Day-6</title>
</head>
<body>
    <h1 id="top">HTML Attributes Practice</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#links">Links</a>
        <a href="#images">Images</a>
        <a href="#form">Form</a>
    </nav>

    <hr>
    <section id="home">

        <h2>Home</h2>

        <p>
            This webpage demonstrates HTML attributes, hyperlinks,
            images, navigation and forms.
        </p>

    </section>

    <hr>
    <section id="links">

        <h2>Hyperlinks</h2>

        <p>
            <a href="https://www.google.com" target="_blank">
                Visit Google
            </a>
        </p>

        <p>
            <a href="day5.html">
                Open Day 5 Page
            </a>
        </p>

    </section>

    <hr>

    <section id="images">

        <h2>Images</h2>

        <br><br>

        <img
            src="img/SLA.png"
            alt="Student studying"
            style="max-width: 50%; height: 50px;"
        >

        <br><br>

    </section>

    <hr>
    <section id="form">

        <h2>Student Registration Form</h2>

        <form action="day5.html" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required
            >

            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required
            >

            <br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="65"
            >

            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="6" required
            >

            <br><br>
            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <br><br>
            <label>Skills:</label>

            <input type="checkbox" id="html" name="skill" value="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="python" name="skill" value="python">
            <label for="python">Python</label>

            <input type="checkbox" id="java" name="skill" value="java">
            <label for="java">Java</label>

            <br><br>

            <label for="department">Department:</label>

            <select id="department" name="department">
                <option value="cse">CSE</option>
                <option value="ece">ECE</option>
                <option value="eee">EEE</option>
            </select>

            <br><br>
            <label for="about">About:</label>

            <br>

            <textarea id="about" name="about" rows="4" cols="30" placeholder="Write something about yourself">
            </textarea>

            <br><br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </form>

    </section>

    <hr>
    <a href="#top">Back to Top</a>

</body>

</html>
