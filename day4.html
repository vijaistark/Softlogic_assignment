<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day-4</title>
</head>
<body>


    <h1>unordered list</h1>
<ul>
  <li>Coffee</li>
  <li>Tea</li>
  <li>Milk</li>
</ul>
    <h1>Ordered list</h1>

<ol type = "I">
    <li>coffee</li>
        <li>milk</li>
            <li>rose milk</li>

</ol>
    <h1>definiton describtion</h1>

<dl>
  <dt>Coffee</dt>
  <dd>- black hot drink</dd>
  <dt>Milk</dt>
  <dd>- white cold drink</dd>
</dl>


<h1>List style type</h1>
<ul style="list-style-type: disc;">
    <li>Apple</li>
    <li>Banana</li>
</ul>

<ul style="list-style-type: circle;">
    <li>Apple</li>
    <li>Banana</li>
</ul>

<ul style="list-style-type: square;">
    <li>Apple</li>
    <li>Banana</li>
</ul>

<ul style="list-style-type: none;">
    <li>Apple</li>
    <li>Banana</li>
</ul>

</body>
</html>
