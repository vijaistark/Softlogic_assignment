<!DOCTYPE html>
<html>
<head>
    <title>Media Tasks</title>
</head>

<body>

    <h1>Media Tasks</h1>

    <h1>Task 1: Iframe</h1>

    <iframe 
        src="https://zoho.com/" width="600px" height="400px">
    </iframe>

    <h1>Task 2: Favorite Movies</h1>

    <h3>My Favorite Movies</h3>

    <ul>
        <li>Interstellar</li>
        <li>Avengers: Endgame</li>
        <li>Iron Man</li>
    </ul>

    <h1>Movie Details</h1>

    <table border="2" cellpadding="10">
        <tr>
            <th>Movie</th>
            <th>Year</th>
            <th>Genre</th>
        </tr>

        <tr>
            <td>Interstellar</td>
            <td>2014</td>
            <td>Sci-Fi</td>
        </tr>


        <tr>
            <td>Avengers: Endgame</td>
            <td>2019</td>
            <td>Action</td>
        </tr>

        <tr>
            <td>Iron Man</td>
            <td>2008</td>
            <td>Action / Sci-Fi</td>
        </tr>
    </table>

    <h3>Movie Trailer</h3>

    <iframe
        width="600"
        height="400"
        src="https://www.youtube.com/embed/zSWdZVtXT7E"
        title="Movie Trailer">
    </iframe>


    <h1>Task 3: Video</h1>

    <video width="320" height="240" controls>
        <source src="img/sample_video.mp4" type="video/mp4">
    </video>


    <h1>Task 4: Audio</h1>

    <audio controls>
        <source src="img/sample_audio.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

</body>
</html>
