<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day34_assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center text-primary mb-4">bootstrap layout</h1>
        <div class="row">
            <div class="col-12 col-lg-4 p-3 bg-primary text-white">
                <h3>column 1</h3>
                <p>this is the first column.</p>
                <div class="row">
                    <div class="col-6 bg-dark p-2">sub column 1</div>
                    <div class="col-6 bg-secondary p-2">sub column 2</div>
                </div>
            </div>
            <div class="col-12 col-lg-4 p-3 bg-success text-white">
                <h3>column 2</h3>
                <p>this is the second column.</p>
            </div>
            <div class="col-12 col-lg-4 p-3 bg-warning">
                <h3>column 3</h3>
                <p>this is the third column.</p>
            </div>
        </div>
        <section class="text-center mt-4 p-4 bg-light">
            <h2 class="text-primary">welcome to bootstrap</h2>
            <p class="mb-0">bootstrap makes responsive web design easy.</p>
        </section>
    </div>
</body>
</html>
