<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day14-assignment</title>
    <style>
        .container {
            display: grid;
            /* display: inline-grid; */
            grid-template-columns: auto auto auto;
            background-color: black;
            padding: 5px;
            column-gap: 15px;
            row-gap: 15px;
            /* gap: 30px 30px; */
        }
        .container > div {
            background-color: white;
            padding: 100px;
            text-align: center;
            font-size: 50px;
        }
        .item1 {
            grid-row-start: 1;
            grid-column-start: 1;
            grid-column-end: 3;
        }

        .item4 {
            grid-column-start: 1;
            grid-column-end: 3;
        }
        .item3 {
            grid-column: 1 / span 3;
        }
        .item6 {
            grid-column: 1 / span 3;
        }
        .item7 {
            grid-row-start: 2;
            grid-row-end: 4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item1" >1</div>
        <div class="item2" >2</div>
        <div class="item3" >3</div>
        <div class="item4" >4</div>
        <div class="item5" >5</div>
        <div class="item6" >6</div>
        <div class="item7" >7</div>

    </div>
</body>
</html>
