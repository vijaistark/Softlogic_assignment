<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-16</title>

    <style>
    
    
    .box1 {
            width: 140px;
            height: 140px;
            font-size: 30px;
            background-color: red;
            border: 2px solid black;
            transform: rotate(30deg);
        }

        .box2 {
            width: 140px;
            height: 140px;
            font-size: 30px;
            background-color: magenta;
            border: 2px solid black;
            transform: rotate(45deg);
        }

        .box3 {
            width: 140px;
            height: 140px;
            font-size: 30px;
            background-color: green;
            border: 2px solid black;
            transform: rotate(60deg);
            align-items: center;
        }

        .box4 {
            width: 150px;
            text-align: center;
            transform: skewX(30deg);
        }

        .box5 {
            width: 150px;
            text-align: center;
            transform: skewX(45deg);
        }

        .box6 {
            width: 150px;
            text-align: center;
            transform: skewX(60deg);
        }

        .img1 {
            transform: rotateY(0deg);
            border: 2px solid black;
        }

        .img2 {
            transform: rotateY(0deg);
            border: 2px solid black;
        }

        .img3 {
            transform: rotateY(60deg);
            border: 2px solid black;
        }

        .img4 {
            transform: rotateY(0deg);
            border: 2px solid black;
        }

        .img5 {
            transform: rotateY(120deg);
            border: 2px solid black;
        }

        .hover-box {
            width: 200px;
            height: 100px;
            background-color: blue;
            color: white;
            font-size: 25px;
            text-align: center;
            padding-top: 30px;
            box-sizing: border-box;

            transition: background-color 0.5s;
        }

        .hover-box:hover {
            background-color: red;
        }
        .grow-box {
            width: 150px;
            height: 100px;
            background-color: orange;
            text-align: center;
            padding-top: 35px;
            box-sizing: border-box;
            font-size: 22px;

            transition: transform 0.5s;
        }

        .grow-box:hover {
            transform: scale(1.3);
        }
        .effect-box {
            width: 180px;
            height: 100px;
            background-color: purple;
            color: white;
            text-align: center;
            padding-top: 30px;
            box-sizing: border-box;
            font-size: 22px;

            transition: all 0.5s;
        }

        .effect-box:hover {
            background-color: green;
            transform: scale(1.2);
            box-shadow: 0 10px 20px gray;
        }
        .reveal-box {
            width: 250px;
            height: 150px;
            background-color: black;
            color: white;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
        }

        .reveal-content {
            opacity: 0;
            transition: opacity 0.5s;
        }

        .reveal-box:hover .reveal-content {
            opacity: 1;
        }

    </style>
</head>

<body>

    <div class="box1">
        Hello World
    </div>

    <br><br>

    <div class="box2">
        Hello World
    </div>

    <br><br>

    <div class="box3">
        Hello World
    </div>

<br><br><br><br>
    <div class="box4">
        <p>Hello Mars</p>
    </div>

    <br><br>

    <div class="box5">
        <p>Hello Mars</p>
    </div>

    <br><br>

    <div class="box6">
        <p>Hello Mars</p>
    </div>



    <img src="https://i.pinimg.com/736x/78/92/8b/78928bd78876ba4a0ef392405d587b7d.jpg"
         alt="transform image"
         width="150"
         height="150"
         class="img1">

    <img src="https://i.pinimg.com/736x/78/92/8b/78928bd78876ba4a0ef392405d587b7d.jpg"
         alt="transform image"
         width="150"
         height="150"
         class="img2">

    <img src="https://i.pinimg.com/736x/78/92/8b/78928bd78876ba4a0ef392405d587b7d.jpg"
         alt="transform image"
         width="150"
         height="150"
         class="img3">

    <img src="https://i.pinimg.com/736x/78/92/8b/78928bd78876ba4a0ef392405d587b7d.jpg"
         alt="transform image"
         width="150"
         height="150"
         class="img4">

    <img src="https://i.pinimg.com/736x/78/92/8b/78928bd78876ba4a0ef392405d587b7d.jpg"
         alt="transform image"
         width="150"
         height="150"
         class="img5">


    <hr>

    <div class="hover-box">
        click Me
    </div>
    <br><br>

    <div class="grow-box">
        click Me
    </div>
        <br><br>

    <div class="effect-box">
        click Me
    </div>
    <div class="reveal-box">
        <h3>click Here</h3>

        <p class="reveal-content">
            This content is revealed!
        </p>
    </div>
</body>

</html>
